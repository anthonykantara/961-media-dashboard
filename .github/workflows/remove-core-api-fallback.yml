name: Remove core app API fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove api.961.co fallback from Media CMS
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          changed = []
          for p in list(Path('src').rglob('*.ts')) + list(Path('src').rglob('*.tsx')):
              text = p.read_text()
              original = text
              text = text.replace(" || (import.meta.env.DEV ? 'http://localhost:5000' : 'https://api.961.co')", " || (import.meta.env.DEV ? 'http://localhost:5000' : '')")
              text = text.replace(" || (import.meta.env.DEV?'http://localhost:5000':'https://api.961.co')", " || (import.meta.env.DEV?'http://localhost:5000':'')")
              text = text.replace("||(import.meta.env.DEV?'http://localhost:5000':'https://api.961.co')", "||(import.meta.env.DEV?'http://localhost:5000':'')")
              if text != original:
                  p.write_text(text)
                  changed.append(str(p))

          print('Updated:', changed)
          workflow = Path('.github/workflows/remove-core-api-fallback.yml')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', *changed, str(workflow)], check=True)
          if changed:
              workflow.unlink()
              subprocess.run(['git', 'add', str(workflow)], check=True)
              subprocess.run(['git', 'commit', '-m', 'fix: isolate Media CMS from core app API'], check=True)
              subprocess.run(['git', 'push'], check=True)
